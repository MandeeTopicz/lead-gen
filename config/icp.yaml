# The one hardcoded ICP. Every weight, threshold, and point value lives here.
# Bump icp.version whenever scoring changes so scores across versions aren't compared.

icp:
  name: austin-logistics-ops-leaders
  version: 1
  gates:
    titles: ["COO", "Chief Operating Officer", "VP of Operations", "VP Operations",
             "Vice President of Operations", "SVP Operations", "Head of Operations"]
    related_titles: ["VP Logistics", "VP Supply Chain"]
    # Partial credit only when this is the whole title: a bare "VP" from an Operations-function search is likely
    # ops, but "VP of Sales" is not.
    bare_titles: ["Vice President", "Senior Vice President", "Executive Vice President"]
    industries: ["Transportation, Logistics, Supply Chain and Storage",
                 "Truck Transportation", "Warehousing and Storage",
                 "Freight and Package Transportation"]
    adjacent_industries: ["Wholesale", "Manufacturing"]   # partial credit only with logistics keywords
  exclude:
    title_terms: ["assistant", "fractional", "consultant", "advisor"]
    company_types: ["Public Company"]
    max_headcount: 1000
  geography:
    primary: "Greater Austin"
    # Full credit when the location names Greater Austin, or one of these places plus Texas.
    primary_places: ["Austin", "Round Rock", "Cedar Park", "Georgetown", "Pflugerville", "Leander",
                     "San Marcos", "Kyle", "Buda", "Hutto", "Lakeway", "Bee Cave", "Dripping Springs",
                     "Manor", "Taylor", "Bastrop", "Lockhart", "Elgin", "Liberty Hill", "West Lake Hills"]
    partial: "Texas"
  tenure: { full_if_months_lt: 12, full_if_years_gte: 3 }
  company: { size_full: [51, 500], size_partial: [[11, 50], [501, 1000]], type: "Privately Held" }
  keywords: ["3PL", "third-party logistics", "freight", "last mile", "last-mile", "drayage",
             "brokerage", "warehousing", "fulfillment", "cold chain", "LTL", "FTL",
             "cross-dock", "supply chain"]

# What the strict search's filters guarantee about every lead it returns. Scoring uses this as provisional
# credit for criteria a result card doesn't show (industry, size, company type); card data always wins.
# Keywords are "partial": the keyword filter is an OR, so it guarantees one match, not two.
search_baseline: { role: full, industry: full, geography: full, activity: full, tenure: full,
                   size: full, company_type: full, keywords: partial }

# Saved searches in Sales Navigator, opened by exact name and never edited. Each one relaxes the baseline:
# `drops` removes a filter, `widens` swaps it for the near-miss range (partial credit only).
searches:
  # S1 filters title, industry, Greater Austin, 51-500 headcount, and privately held. It leaves tenure, activity,
  # and keywords unfiltered so the pool isn't too small; the scorer judges those from each card.
  S1: { name: S1-strict, drops: [activity, tenure, keywords] }
  # Enable each one once it exists in Sales Navigator; a run halts on an enabled search it can't find.
  S2: { name: S2-no-activity, drops: [activity], enabled: false }
  S3: { name: S3-no-tenure, drops: [tenure], enabled: false }
  S4: { name: S4-wider-size, widens: [size], enabled: false }
  S5: { name: S5-wider-area, widens: [geography], enabled: false }
  S6: { name: S6-no-keywords, drops: [keywords], enabled: false }
  S7: { name: S7-new-in-role, drops: [activity], enabled: false }   # plus Spotlight: Changed jobs in past 90 days

weights:
  match: { role: 20, industry: 18, geography: 16, activity: 14, tenure: 12,
           size: 10, company_type: 6, keywords: 4 }
  response: { activity: 25, affinity: 20, local: 15, trigger: 15, reach: 15, new_in_role: 10 }
  priority: { match: 0.6, response: 0.4 }

# Partial credit for the ICP match score. Full credit is the weight above.
match_points:
  role_related: 12
  industry_adjacent: 9
  geography_partial: 6
  activity: { full_within_days: 30, partial_within_days: 90, partial: 6 }
  tenure_1_to_3_years: 0
  size_partial: 4
  company_type_other: 0
  keywords: { full_min_matches: 2, one_match: 2 }

# Point rules for the response likelihood score. Each factor is capped at its weight.
response_points:
  activity: { within_7_days: 25, within_30_days: 18, within_90_days: 8 }
  affinity: { shared_connections: 10, shared_background: 10 }
  local: 15
  trigger: { hiring: 8, news: 7, news_within_days: 90 }
  reach: { verified_email: 6, phone: 4, connection_or_open_profile: 5 }
  new_in_role: { points: 10, within_months: 12 }
  labels: { high: 70, medium: 45 }

quality_bar:
  min_match: 60
  max_leads: 25
  warn_below: 10
  suppress_days: 30   # a lead in a digest this recently is left out unless something new happened

caps:
  result_pages: 30
  pages_per_search: 4      # so later searches still run before the run-wide cap
  deep_reads: 40
  deep_read_refresh_days: 30   # reuse a lead's or company's deep read younger than this
  scheduled_runs_per_day: 1
  manual_runs_per_day: 2
  delay_seconds: [4, 12]

browser:
  channel: chrome          # installed Google Chrome; "chromium" uses Playwright's bundled build
  headless: true           # runs don't open a window; `leadgen login` always does
  start_url: https://www.linkedin.com/sales/home
  page_timeout_seconds: 45

llm:
  fast_model: claude-haiku-4-5    # classification and communication-style tagging
  writer_model: claude-sonnet-5   # reasons, summaries, and drafted messages

# Stage 7: Claude researches each top lead with its built-in web search and web fetch (no other vendors).
research:
  model: claude-sonnet-5
  max_leads: 25            # best-matching leads that passed the gates
  max_searches: 4          # per lead
  max_fetches: 3           # per lead (company site about, contact, and careers pages)
  max_fetch_tokens: 6000   # cap on each fetched page's content; uncapped pages made research ~$0.60 a lead
  refresh_days: 30         # reuse a lead's research younger than this
  max_usd_per_run: 10.0    # stop researching once this run's research spend passes this

# Stage 9: communication style (fast model) and reasons, summaries, and drafts (writer model).
drafting:
  max_usd_per_run: 5.0

sequence:
  linkedin: { touches: 10, per_week: 2, inmail_fallback_after_days: 5 }
  email: { touches: 2, start_week: 6 }
  calls: { touches: 2, start_week: 6 }
